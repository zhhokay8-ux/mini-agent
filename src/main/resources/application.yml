server:
  port: 8080

logging:
  charset:
    console: UTF-8

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout: 90s
  max-iterations: 5

rag:
  chunk-size: 500
  chunk-overlap: 50
  top-k: 5
  knowledge-pattern: classpath*:knowledge/**/*.{md,txt,pdf}

session:
  max-recent-turns: 6
  summary-max-chars: 400

spring:
  datasource:
    url: jdbc:h2:file:./data/mini-agent;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
