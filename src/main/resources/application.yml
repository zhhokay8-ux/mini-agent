server:
  port: 8080

logging:
  charset:
    console: UTF-8

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout: 90s
  max-iterations: 5

rag:
  chunk-size: 500
  chunk-overlap: 50
  top-k: 5
  knowledge-pattern: classpath*:knowledge/**/*.{md,txt,pdf}
